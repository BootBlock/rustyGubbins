name: Suggest a feature
description: A new control, a theme, or a better way for something the library already does.
title: "Feature: "
labels: ["type: feature", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. We write every change ourselves rather than taking pull requests, so describing what you need is the best way to get it into rustyGubbins.
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Tell us what you're trying to build, and what gets in the way today.
      placeholder: I'd like a date picker that…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How do you picture it working?
      description: How it should look and behave, including with the keyboard and a screen reader if you have thoughts on that. A sketch or a screenshot from another app is welcome.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the library is it?
      options:
        - Controls
        - Theming
        - Glass
        - Text and Markdown
        - Motion
        - Accessibility
        - Platform (windows, GPUs, the operating system)
        - Building with Cargo
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Workarounds you've tried, or anything else that might help.
